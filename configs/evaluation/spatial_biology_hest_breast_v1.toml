# Frozen protocol declaration for hest_biological_conch15_titan/final.
# Paths are intentionally outside the repository and resolve through EAF_WSI_ROOT.
version = 1
coordinate_system = "level0_xy"
reference = "full"
spots = "$EAF_WSI_ROOT/datasets/hest_biology_hest1k_breast_v1/spots.csv"
expression = "$EAF_WSI_ROOT/datasets/hest_biology_hest1k_breast_v1/expression.npz"
normalization = "counts"
expression_layer = ""
signatures = "$EAF_WSI_ROOT/datasets/hest_biology_hest1k_breast_v1/immune_stromal_programs_v1.gmt"
min_signature_coverage = 0.8
pca_components = 256
alphas = [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
bootstrap = 2000
max_plot_slides = 6

# The HEST sample manifest, QC, patient grouping, and niche annotations are frozen
# in spots.csv. No random spot-level split is permitted.
split_policy = "patient_disjoint_hest_release_manifest_v1"
spot_policy = "registered_h_and_e_st_centres_level0_only"
primary_programs = ["immune_activation", "stromal_ecm"]
primary_metrics = ["pearson", "spearman", "rmse", "edge_rmse", "moran_abs_error", "coverage"]

[[methods]]
name = "full"
embeddings = "$EAF_WSI_ROOT/caches/spatial/hest_biology_hest1k_breast_v1/conch_v15/tile/full.npz"
slide_embeddings = "$EAF_WSI_ROOT/caches/spatial/hest_biology_hest1k_breast_v1/conch_v15_titan/wsi/full.npz"
citation = "CONCH v1.5/TITAN: https://doi.org/10.1038/s41591-025-03982-3"
supervision = "frozen foundation model; downstream patient-balanced ridge only"
pretraining_overlap = "must be audited against HEST sample IDs before interpretation"

[[methods]]
name = "eaf"
embeddings = "$EAF_WSI_ROOT/caches/experiments/hest_biological_conch15_titan/final/seed_42/spatial/tile/eaf.npz"
slide_embeddings = "$EAF_WSI_ROOT/caches/experiments/hest_biological_conch15_titan/final/seed_42/spatial/wsi/eaf.npz"
selection = "$EAF_WSI_ROOT/caches/experiments/hest_biological_conch15_titan/final/seed_42/spatial/wsi/selection.csv"
provenance = "$EAF_WSI_ROOT/caches/experiments/hest_biological_conch15_titan/final/seed_42/spatial/wsi/provenance.json"
citation = "EAF; checkpoint and registry provenance recorded by exporter"
supervision = "HISTAI-only EAF and distillation; downstream patient-balanced ridge only"
pretraining_overlap = "HISTAI training corpus must be disjoint from registered HEST patients"

# Literature competitors use exactly the same spots, crops and patient split.
# They remain declared as files under the frozen protocol even when their runs
# are produced externally. Their provenance JSON must record commit/checkpoint,
# reference bank, and whether test expression was used (it must be false).
[[methods]]
name = "uni"
embeddings = "$EAF_WSI_ROOT/caches/spatial/hest_biology_hest1k_breast_v1/competitors/uni/spot_embeddings.npz"
slide_embeddings = "$EAF_WSI_ROOT/caches/spatial/hest_biology_hest1k_breast_v1/competitors/uni/slide_embeddings.npz"
provenance = "$EAF_WSI_ROOT/caches/spatial/hest_biology_hest1k_breast_v1/competitors/uni/provenance.json"
citation = "UNI: https://doi.org/10.1038/s41591-024-02857-3"
supervision = "frozen external foundation model; same downstream ridge protocol"
pretraining_overlap = "unknown until release/sample audit is recorded"

# BLEEP/TRIPLEX predictions are intentionally not part of this frozen v1 run:
# they can be added only after an external run provides a real split hash and
# leakage audit, which would constitute protocol v2.
