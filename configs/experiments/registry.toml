version = 1

# Scientific identity is always: experiment_id / variant_id / seed.
# Timestamps, UUIDs, scheduler IDs and W&B IDs are metadata only.
# Ablations are performed on CONCH v1.5 + TITAN. Other FMs inherit the frozen recipe.

[experiments.tile_source_ablation_conch15]
family = "tile_eaf"
stage = "forecaster"
status = "ready"
dataset_id = "histai_core_v1"
tile_encoder = "conch_v15"
description = "Select the Tile-EAF source layer on CONCH v1.5."

[experiments.tile_source_ablation_conch15.variants.src00]
source_layer = 0
model_name = "conch_v15"

[experiments.tile_source_ablation_conch15.variants.src01]
source_layer = 1
model_name = "conch_v15"

[experiments.tile_source_ablation_conch15.variants.src02]
source_layer = 2
model_name = "conch_v15"

[experiments.tile_source_ablation_conch15.variants.src03]
source_layer = 3
model_name = "conch_v15"

[experiments.tile_keep_ablation_conch15]
family = "tile_eaf"
stage = "distillation"
status = "blocked"
dataset_id = "histai_core_v1"
tile_encoder = "conch_v15"
description = "Compare tile keep ratios after freezing the selected CONCH source layer."
blockers = ["Set the selected prune_layer after tile_source_ablation_conch15 is closed."]

[experiments.tile_keep_ablation_conch15.variants.keep10]
keep_ratio = 0.10
model_name = "conch_v15"

[experiments.tile_keep_ablation_conch15.variants.keep20]
keep_ratio = 0.20
model_name = "conch_v15"

[experiments.wsi_source_ablation_conch15_titan]
family = "wsi_eaf"
stage = "forecaster"
status = "blocked"
dataset_id = "histai_core_v1"
tile_encoder = "conch_v15"
wsi_encoder = "titan"
description = "Select the TITAN source layer using frozen pruned-CONCH inputs."
blockers = [
  "Freeze the optimal CONCH tile configuration.",
  "Build the canonical pruned CONCH tile cache.",
  "Build the TITAN source cache from that pruned tile cache."
]

[experiments.wsi_source_ablation_conch15_titan.variants.src00]
titan_hidden_layer = 0
input_source = "titan_hidden"

[experiments.wsi_source_ablation_conch15_titan.variants.src01]
titan_hidden_layer = 1
input_source = "titan_hidden"

[experiments.wsi_source_ablation_conch15_titan.variants.src02]
titan_hidden_layer = 2
input_source = "titan_hidden"

[experiments.wsi_source_ablation_conch15_titan.variants.src03]
titan_hidden_layer = 3
input_source = "titan_hidden"

[experiments.wsi_keep_ablation_conch15_titan]
family = "wsi_eaf"
stage = "distillation"
status = "blocked"
dataset_id = "histai_core_v1"
tile_encoder = "conch_v15"
wsi_encoder = "titan"
description = "Compare WSI keep ratios after freezing the selected TITAN source layer."
blockers = ["Set the selected TITAN prune_layer after wsi_source_ablation_conch15_titan is closed."]

[experiments.wsi_keep_ablation_conch15_titan.variants.keep10]
keep_ratio = 0.10

[experiments.wsi_keep_ablation_conch15_titan.variants.keep20]
keep_ratio = 0.20

[experiments.tile_eval_thunder_conch15]
family = "tile_eaf"
stage = "evaluation"
status = "blocked"
dataset_id = "thunder"
tile_encoder = "conch_v15"
description = "Final THUNDER evaluation of the frozen CONCH v1.5 configuration."
blockers = ["Freeze the final tile source layer and keep ratio."]

[experiments.tile_eval_thunder_conch15.variants.final]
model_name = "conch_v15"

[experiments.wsi_eval_eagle_conch15_titan]
family = "wsi_eaf"
stage = "evaluation"
status = "blocked"
dataset_id = "eagle_compatible"
tile_encoder = "conch_v15"
wsi_encoder = "titan"
description = "Final TCGA/CPTAC/Patho-Bench-compatible WSI evaluation."
blockers = ["Freeze the final TITAN configuration and prepare downstream caches."]

[experiments.wsi_eval_eagle_conch15_titan.variants.final]

[experiments.hest_biological_conch15_titan]
family = "wsi_eaf"
stage = "evaluation"
status = "blocked"
dataset_id = "hest"
tile_encoder = "conch_v15"
wsi_encoder = "titan"
description = "Biological HEST evaluation distinct from pure classification."
blockers = ["Freeze the biological target/protocol and dataset split before launch."]

[experiments.hest_biological_conch15_titan.variants.final]
